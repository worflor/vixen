[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vixen-curves"
version = "1.3.0"
description = "Deterministic seeded game curves with a controllable trajectory backbone"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "worflor"}]
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.24"]
artwork = ["Pillow>=10"]

[tool.setuptools]
py-modules = ["vixen"]
