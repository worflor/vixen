[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vixen-curves"
version = "1.5.0"
description = "Deterministic, navigable progression fields with replayable timelines and function guides. JavaScript, Python and Java; no runtime dependencies."
keywords = ["deterministic", "procedural-generation", "trajectory-generation", "seeded-randomness", "interpolation", "numerical-methods", "javascript", "python"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "worflor"}]
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.24"]
artwork = ["Pillow>=10"]

[tool.setuptools]
py-modules = ["vixen_extended_operations", "vixen_extended_coupling", "vixen_extended", "vixen_scaled_state", "vixen_influence_calculus", "vixen_operation_calculus", "vixen", "vixen_analysis", "vixen_api", "vixen_calculus", "vixen_checkpoint", "vixen_correlation", "vixen_float", "vixen_guide", "vixen_influence", "vixen_interval", "vixen_jet_composition", "vixen_operations", "vixen_timeline", "vixen_wide", "vixen_exponential"]
