[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vixen-curves"
version = "1.4.0"
description = "Deterministic, navigable progression fields with replayable timelines and function guides. JavaScript and Python; no runtime dependencies."
keywords = ["deterministic", "procedural-generation", "trajectory-generation", "seeded-randomness", "interpolation", "numerical-methods", "javascript", "python"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "worflor"}]
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.24"]
artwork = ["Pillow>=10"]

[tool.setuptools]
py-modules = ["vixen", "vixen_guide", "vixen_influence"]
